{% load static %}
<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8" />
    <title>Регистрация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <style>
        body {
            background-image: url("{% static 'images/background_register.jpg' %}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
    </style>
</head>
<body>
    <div class="overlay">
        <h1>Регистрация</h1>
        <div class="card p-4 mx-auto" style="max-width: 420px; border-radius: 20px;">
            <form method="post" novalidate>
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn-custom w-100 mt-3">Регистрирай се</button>
            </form>
            <p class="mt-4 text-center">Вече имаш акаунт? <a href="{% url 'login' %}" style="color:#FF5722;">Вход</a></p>
        </div>
    </div>
</body>
</html>
