{% load static %}
<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8" />
    <title>Вход</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <style>
        body {
            background-image: url("{% static 'images/background_login.jpg' %}");
        }
    </style>
</head>
<body>
    <div class="overlay">
        <h1>Вход</h1>
        <div class="card p-4 mx-auto" style="max-width: 400px;">
            <form method="post" novalidate>
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn-custom w-100 mt-3">Влез</button>
            </form>
            <p class="mt-3">Нямаш акаунт? <a href="{% url 'register' %}">Регистрация</a></p>
        </div>
    </div>
</body>
</html>
