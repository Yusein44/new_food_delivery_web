{% extends 'accounts/base.html' %}
{% load static %}

{% block title %}Вход{% endblock %}

{% block content %}
<style>
  body {
    margin: 0;
    padding: 0;
    background-image: url("{% static 'images/background_login.jpg' %}");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    height: 100vh;
  }
</style>

<div class="d-flex justify-content-center align-items-center" style="min-height: 100vh;">
  <form method="post" class="p-4 rounded bg-dark bg-opacity-75 text-white" style="min-width: 320px; max-width: 400px; width: 100%;">
    <h1 class="mb-4 text-center">Вход</h1>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-warning w-100">Влез</button>

    {% if messages %}
      <ul class="mt-3">
        {% for message in messages %}
          <li>{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}
  </form>
</div>
{% endblock %}
